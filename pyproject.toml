[project]
name = "ble-chassis-control"
version = "0.1.0"
description = "底盘上位机:HC-05 串口 / BLE 双链路,控制指令下发与数据回传显示"
readme = "README.md"
authors = [
    { name = "applepine0", email = "mmygtxdt1@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.2",
    "pyserial>=3.5",
    "sv-ttk>=2.6.1",
]

[project.scripts]
ble-chassis-control = "ble_chassis_control:main"

[dependency-groups]
dev = [
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 历史代码里有少量长行,先不阻断;格式化交给 ruff format 逐步处理
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ble_chassis_control"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"